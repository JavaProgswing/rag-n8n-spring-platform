name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Test and package
        run: ./mvnw --batch-mode verify
      - name: Validate Docker Compose
        run: docker compose -f compose.yml config
      - name: Start production stack
        run: docker compose -f compose.yml up --detach --build
      - name: Verify n8n, databases, retrieval, and cache
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://localhost:8080/api/v1/status > /tmp/status.json &&
               jq -e '.status == "ready" and .vectorStore == "postgres"' /tmp/status.json > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Spring Boot did not become ready"
              exit 1
            fi
            sleep 5
          done

          for attempt in {1..30}; do
            if curl --fail --silent --connect-timeout 2 --max-time 5 http://localhost:5678/healthz/readiness > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "n8n did not become ready"
              exit 1
            fi
            sleep 5
          done

          for attempt in {1..30}; do
            response_code=$(curl --silent --output /tmp/ingest.json --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 10 \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"title":"CI operations guide","source":"n8n-ci","content":"For a priority one incident, the incident commander coordinates recovery and records the timeline."}' \
              http://localhost:5678/webhook/knowledge-ingest || true)
            if [ "$response_code" = "200" ] && jq -e '.chunksCreated >= 1' /tmp/ingest.json > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "n8n ingestion failed with HTTP $response_code"
              cat /tmp/ingest.json
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"question":"Who coordinates priority one recovery?","topK":3,"conversationId":"ci"}' \
            http://localhost:8080/api/v1/query > /tmp/first-query.json
          jq -e '.cached == false and (.sources | length) >= 1 and (.answer | contains("incident commander"))' \
            /tmp/first-query.json > /dev/null

          curl --fail --silent \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"question":"Who coordinates priority one recovery?","topK":3,"conversationId":"ci"}' \
            http://localhost:8080/api/v1/query > /tmp/second-query.json
          jq -e '.cached == true' /tmp/second-query.json > /dev/null
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose -f compose.yml down --volumes
