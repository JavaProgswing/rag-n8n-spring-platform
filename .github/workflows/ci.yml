name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Test and package
        run: ./mvnw --batch-mode verify
      - name: Validate Docker Compose
        run: docker compose -f compose.yml config
      - name: Start production stack
        run: docker compose -f compose.yml up --detach --build
      - name: Verify n8n, databases, retrieval, and cache
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /tmp/health.json &&
               jq -e '.status == "UP"' /tmp/health.json > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Spring Boot did not become healthy"
              exit 1
            fi
            sleep 5
          done

          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:5678/healthz > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "n8n did not become healthy"
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent +            --request POST +            --header "Content-Type: application/json" +            --data '{"title":"CI operations guide","source":"n8n-ci","content":"For a priority one incident, the incident commander coordinates recovery and records the timeline."}' +            http://localhost:5678/webhook/knowledge-ingest |
            jq -e '.chunksCreated >= 1' > /dev/null

          curl --fail --silent +            --request POST +            --header "Content-Type: application/json" +            --data '{"question":"Who coordinates priority one recovery?","topK":3,"conversationId":"ci"}' +            http://localhost:8080/api/v1/query > /tmp/first-query.json
          jq -e '.cached == false and (.sources | length) >= 1 and (.answer | contains("incident commander"))' +            /tmp/first-query.json > /dev/null

          curl --fail --silent +            --request POST +            --header "Content-Type: application/json" +            --data '{"question":"Who coordinates priority one recovery?","topK":3,"conversationId":"ci"}' +            http://localhost:8080/api/v1/query > /tmp/second-query.json
          jq -e '.cached == true' /tmp/second-query.json > /dev/null
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.yml logs --no-color
      - name: Stop production stack
        if: always()
        run: docker compose -f compose.yml down --volumes
